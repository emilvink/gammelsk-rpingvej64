<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skørping</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    /* Subtle darkening makes the text easy to read without changing the photo. */
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: white;
      text-shadow: 0 2px 12px rgba(0,0,0,.65);
      padding: 24px;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(3.5rem, 10vw, 8rem);
      font-weight: 700;
      letter-spacing: .02em;
    }

    #countdown {
      display: flex;
      justify-content: center;
      gap: clamp(10px, 3vw, 30px);
      font-variant-numeric: tabular-nums;
    }

    .unit {
      min-width: clamp(70px, 10vw, 130px);
    }

    .number {
      display: block;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
    }

    .label {
      display: block;
      margin-top: 9px;
      font-size: clamp(.7rem, 1.5vw, 1rem);
      text-transform: uppercase;
      letter-spacing: .14em;
      opacity: .9;
    }

    @media (max-width: 600px) {
      h1 { margin-bottom: 18px; }
      #countdown { gap: 7px; }
      .unit { min-width: 65px; }
      .label { letter-spacing: .06em; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="photo" src="hus.png" alt="">
    <div class="shade"></div>

    <section class="content" aria-label="Nedtælling til indflytning">
      <h1>Skørping</h1>

      <div id="countdown">
        <div class="unit">
          <span class="number" id="days">0</span>
          <span class="label">dage</span>
        </div>
        <div class="unit">
          <span class="number" id="hours">00</span>
          <span class="label">timer</span>
        </div>
        <div class="unit">
          <span class="number" id="minutes">00</span>
          <span class="label">minutter</span>
        </div>
        <div class="unit">
          <span class="number" id="seconds">00</span>
          <span class="label">sekunder</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Indflytning: 1. december 2026 kl. 00:00 dansk tid.
    const target = new Date("2026-12-01T00:00:00+01:00").getTime();

    const pad = n => String(n).padStart(2, "0");

    function updateCountdown() {
      const distance = target - Date.now();

      if (distance <= 0) {
        document.getElementById("days").textContent = "0";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      const totalSeconds = Math.floor(distance / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 250);
  </script>
</body>
</html>
